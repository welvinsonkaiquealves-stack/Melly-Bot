name: Pull Request CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.0'
  FLUTTER_VERSION: '3.47.2'
  # API 37 is published by sdkmanager as the minor-version package 37.0.
  ANDROID_PLATFORM_VERSION: '37.0'
  NDK_VERSION: '28.2.13676358'
  ALLOWED_THIRD_PARTY_WRAPPER_SHA: 'ee3739525a995bcb5601621a6e2daec1f183bbefc375743acc235cec33547e04'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Secret scan (gitleaks)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Skip secret scan for fork pull requests
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "Skipping gitleaks for fork PRs because repository secrets are not available to pull_request workflows from forks."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: webchat/pnpm-lock.yaml

      - name: Verify app-update Worker and models.dev sync
        working-directory: workers/app-update-worker
        run: npm test

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4
        with:
          allow-checksums: ${{ env.ALLOWED_THIRD_PARTY_WRAPPER_SHA }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Android SDK
        run: |
          sdkmanager_path="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          test -x "$sdkmanager_path"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            sdkmanager_path="$(readlink -f "$sdkmanager_path")"
            sdk_root="${sdkmanager_path%%/cmdline-tools/*}"
          fi
          test -d "$sdk_root"
          "$sdkmanager_path" --version
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"

      - name: Cache Android SDK platform
        id: cache-android-platform
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-${{ env.ANDROID_PLATFORM_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/licenses
          key: ${{ runner.os }}-android-platform-${{ env.ANDROID_PLATFORM_VERSION }}

      - name: Install Android SDK platform
        if: steps.cache-android-platform.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-${{ env.ANDROID_PLATFORM_VERSION }}"

      - name: Cache Android NDK
        id: cache-android-ndk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/licenses
          key: ${{ runner.os }}-android-ndk-${{ env.NDK_VERSION }}

      - name: Install Android NDK
        if: steps.cache-android-ndk.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Export Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Install Flutter dependencies
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Flutter test
        working-directory: ui
        run: flutter test

      - name: Flutter analyze
        working-directory: ui
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Gradle unit tests, lint and debug APK
        run: >-
          ./gradlew --no-daemon --parallel --build-cache --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED"
          :app:testDevelopStandardDebugUnitTest
          :app:lintDevelopStandardDebug
          :app:assembleDevelopStandardDebug
          -Ptarget=lib/main_standard.dart

      - name: Summarize Android verification
        id: android-verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          test_reports = sorted(Path("app/build/test-results").glob("**/TEST-*.xml"))
          if not test_reports:
              raise SystemExit("No Kotlin/JVM test result XML files were found")

          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          duration = 0.0
          for report in test_reports:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.attrib.get(key, 0))
                  duration += float(suite.attrib.get("time", 0))

          lint_reports = sorted(Path("app/build/reports").glob("lint-results-*.xml"))
          lint_issues = []
          for report in lint_reports:
              lint_issues.extend(ET.parse(report).getroot().findall("issue"))
          lint_errors = sum(
              issue.attrib.get("severity", "").lower() in {"error", "fatal"}
              for issue in lint_issues
          )

          apks = sorted(Path("app/build/outputs/apk").glob("**/*.apk"))
          if not apks:
              raise SystemExit("No debug APK was produced")
          apk_bytes = sum(apk.stat().st_size for apk in apks)

          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as output:
              output.write("## Android verification\n\n")
              output.write(
                  f"- Kotlin/JVM tests: {totals['tests']} total, "
                  f"{totals['failures']} failures, {totals['errors']} errors, "
                  f"{totals['skipped']} skipped ({duration:.2f}s)\n"
              )
              output.write(
                  f"- Android lint: {len(lint_issues)} findings, "
                  f"{lint_errors} errors/fatal\n"
              )
              output.write(
                  f"- Debug APK: {len(apks)} file(s), "
                  f"{apk_bytes / 1024 / 1024:.2f} MiB total\n"
              )
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: melly-develop-standard-debug-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
